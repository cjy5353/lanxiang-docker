name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 校验生成物与仓库一致
        run: |
          npm run sync
          if ! git diff --exit-code --quiet -- server/handler.ts supabase/functions public/quiz-data.json; then
            echo "::error::生成结果与仓库中的文件不一致，请在本地运行 npm run sync 并提交后再推送。"
            git --no-pager diff --stat
            exit 1
          fi
      - name: 运行测试
        run: npm test
      - name: 构建前端
        run: npm run build
        env:
          # Supabase Edge Function 地址；可在仓库变量 VITE_API_BASE 中覆盖
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://fysgkjxjsmeiqpjrikhz.supabase.co/functions/v1/assessment-api/' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
